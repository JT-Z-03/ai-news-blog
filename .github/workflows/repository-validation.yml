name: Repository validation

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  repository-validation:
    name: repository-validation
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: recursive

      - name: Set up pinned Node major
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
          cache: npm

      - name: Install locked validation dependencies
        run: npm ci --ignore-scripts

      - name: Install pinned Hugo Extended
        shell: bash
        run: |
          set -euo pipefail
          version="$(tr -d '\r\n' < .hugo-version)"
          [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]
          archive="hugo_extended_${version}_linux-amd64.tar.gz"
          release="https://github.com/gohugoio/hugo/releases/download/v${version}"
          install_dir="${RUNNER_TEMP}/hugo"
          mkdir -p "$install_dir"
          curl --fail --silent --show-error --location "${release}/${archive}" --output "${install_dir}/${archive}"
          curl --fail --silent --show-error --location "${release}/hugo_${version}_checksums.txt" --output "${install_dir}/checksums.txt"
          cd "$install_dir"
          grep -E "^[0-9a-fA-F]{64}  ${archive//./\.}$" checksums.txt | sha256sum --check --strict
          tar -xzf "$archive" hugo
          echo "$install_dir" >> "$GITHUB_PATH"

      - name: Validate toolchain, content, pages, and production build
        shell: pwsh
        run: ./scripts/validate-all.ps1

      - name: Build browser acceptance output
        run: node scripts/build-site.mjs --destination .validation-public

      - name: Install browser engines
        run: npx playwright install --with-deps chromium firefox webkit

      - name: Check browser layouts, search, keyboard and CSP
        run: npm run test:browser

      - name: Retain browser evidence
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: browser-acceptance
          path: |
            test-results/
            playwright-report/
          if-no-files-found: ignore
          retention-days: 7
