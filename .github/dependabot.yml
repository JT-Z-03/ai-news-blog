version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: monthly
      time: '09:00'
      timezone: Asia/Shanghai
    open-pull-requests-limit: 3
    groups:
      validation-minor-patch:
        patterns: ['*']
        update-types: [minor, patch]
    commit-message:
      prefix: deps

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
      time: '09:00'
      timezone: Asia/Shanghai
    open-pull-requests-limit: 2
    commit-message:
      prefix: ci

  - package-ecosystem: gitsubmodule
    directory: /
    schedule:
      interval: monthly
      time: '09:00'
      timezone: Asia/Shanghai
    open-pull-requests-limit: 1
    commit-message:
      prefix: theme
